# ~/.config/starship.toml

add_newline = false
# single line prompt version
#format = "$username$hostname$localip$shlvl$singularity$kubernetes$nats$directory$vcsh$fossil_branch$fossil_metrics$git_branch$git_commit$git_state$git_metrics$git_status$hg_branch$hg_state$pijul_channel$docker_context$package$bun$c$cmake$cobol$cpp$daml$dart$deno$dotnet$elixir$elm$erlang$fennel$fortran$gleam$golang$gradle$haskell$haxe$helm$java$julia$kotlin$lua$maven$mojo$nim$nodejs$ocaml$odin$opa$perl$php$pulumi$purescript$python$quarto$raku$rlang$red$ruby$rust$scala$solidity$swift$terraform$typst$vlang$vagrant$xmake$zig$buf$guix_shell$nix_shell$conda$pixi$meson$spack$memory_usage$aws$gcloud$openstack$azure$direnv$env_var$mise$crystal$custom$sudo$cmd_duration$jobs$battery$time$status$container$netns$os$shell$character"

# Prompt character - green on success, red on error
[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

# Show last 4 path components, truncate at repo root
[directory]
truncation_length = 4
truncate_to_repo = true

# Git branch
[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "

# Git status - staged, modified, untracked counts
[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"
conflicted = "✖${count}"

# C/C++ - shows detected compiler version
[c]
disabled = false
format = "[$symbol($version(-$name))]($style) "

# CMake - shows version when CMakeLists.txt is present
[cmake]
disabled = false

# Python - shows venv name and version
[python]
symbol = " "
detect_files = ["pyproject.toml", "setup.py", "requirements.txt", "uv.lock"]

# Show exit code of last command if non-zero
[status]
disabled = false
format = "[$status]($style) "

# Execution time - show if command took longer than 5s
# Useful for knowing how long a build took
[cmd_duration]
min_time = 5_000
format = "[ $duration]($style) "
show_milliseconds = false