# Status bar
set -g status-style bg=#1e1e1e,fg=#d4d4d4

# Active window tab
set -g window-status-current-style bg=#3a3a3a,fg=#ffffff,bold

# Inactive window tabs
set -g window-status-style bg=#1e1e1e,fg=#808080

# Pane borders
set -g pane-border-style fg=#3a3a3a
set -g pane-active-border-style fg=#808080

# Command/message line
set -g message-style bg=#3a3a3a,fg=#ffffff

# Increase history length
set -g history-limit 50000

# Allow scrolling with mouse
set -g mouse on